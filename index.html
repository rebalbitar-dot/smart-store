<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Smart Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top shadow">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning" href="#" onclick="location.reload()">Smart Store</a>
            <div class="d-flex align-items-center">
                <span id="userInfoNav" class="text-info-custom me-3"></span>

                <!-- Navigation buttons -->
                <button id="navPurchasesBtn" class="btn btn-info btn-sm fw-bold me-2 d-none" onclick="showPurchases()">
                    📦 My Purchases
                </button>

                <button id="navShopBtn" class="btn btn-primary btn-sm fw-bold me-2 d-none" onclick="backToShop()">
                    🏪 Shop
                </button>

                <!-- Cart -->
                <button id="cartBtn"
                    class="btn btn-warning btn-sm fw-bold me-2 d-none"
                    type="button"
                    data-bs-toggle="offcanvas"
                    data-bs-target="#cartOffcanvas">
                    🛒 Cart (<span id="cartCount">0</span>)
                </button>

                <button id="logoutBtn" class="btn btn-outline-danger btn-sm d-none" onclick="handleLogout()">Logout</button> 
            </div>
        </div>
    </nav>

<!-- Cart Offcanvas -->
<div class="offcanvas offcanvas-top h-auto" id="cartOffcanvas">
    <div class="offcanvas-header border-bottom border-secondary">
        <h5 class="offcanvas-title text-warning">Smart Cart 🛒</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
        <div id="cartItems" class="row"></div>

        <!-- Total + checkout -->
        <div class="d-flex justify-content-between align-items-center mt-3">
            <h4 id="cartTotal">Total: 0 $</h4>
            <button class="btn btn-success px-5" onclick="handleCheckout()">Confirm Purchase ✅</button>
        </div>
    </div>
</div>

<div class="container mt-4">

    <!-- AUTH PAGE -->
    <section id="page-auth">
        <div class="row justify-content-center g-4">

            <!-- LOGIN -->
            <div class="col-md-5">
                <div class="auth-container">
                    <h4 class="text-center mb-4 text-warning">Login</h4>

                    <label class="form-label text-light">User ID</label>
                    <input type="number" id="userIdInput"
                        class="form-control mb-3 bg-dark text-white border-secondary"
                        placeholder="Enter your ID"
                        min="1"
                        step="1"
                        required>

                    <button class="btn btn-primary w-100 fw-bold" onclick="handleAuth()">
                        Enter Store
                    </button>
                </div>
            </div>

            <!-- SIGNUP -->
            <div class="col-md-5">
                <div class="auth-container">
                    <h4 class="text-center mb-4 text-success">Create Account</h4>

                    <label class="form-label text-light">User ID</label>
                    <input type="number" id="newId"
                        class="form-control mb-2 bg-dark text-white border-secondary"
                        placeholder="ID (e.g. 501)"
                        min="1"
                        step="1"
                        required>

                    <label class="form-label text-light">Age</label>
                    <input type="number" id="newAge"
                        class="form-control mb-2 bg-dark text-white border-secondary"
                        placeholder="Age (e.g. 25)"
                        min="1"
                        max="120"
                        step="1"
                        required>

                    <label class="form-label text-light">Country</label>
                    <select id="newCountry" class="form-select mb-3 bg-dark text-white border-secondary">
                        <option value="Qatar">Qatar</option>
                        <option value="Jordan">Jordan</option>
                        <option value="Morocco">Morocco</option>
                        <option value="Egypt">Egypt</option>
                        <option value="UAE">UAE</option>
                        <option value="Kuwait">Kuwait</option>
                        <option value="Syria">Syria</option>
                        <option value="Lebanon">Lebanon</option>
                        <option value="Palestine">Palestine</option>
                        <option value="Iraq">Iraq</option>
                    </select>

                    <button class="btn btn-success w-100 fw-bold" onclick="handleSignup()">
                        Create Account
                    </button>
                </div>
            </div>

        </div>
    </section>

    <!-- SHOP PAGE -->
    <section id="page-shop" class="d-none">
        <div id="categoryFilters" class="mb-4 d-flex justify-content-center flex-wrap gap-2"></div>
        <div id="productsGrid" class="row g-4"></div>
    </section>

    <!-- PURCHASES PAGE -->
    <section id="page-purchases" class="d-none">
        <h3 class="text-center text-warning mb-4">My Purchases</h3>
        <div id="purchasesGrid" class="row g-4"></div>
    </section>

</div>

<!-- PRODUCT MODAL -->
<div class="modal fade" id="productModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-light"
            style="background:#0f172a; border:1px solid #334155; border-radius:16px;">

            <!-- Modal Header -->
            <div class="modal-header border-secondary">
                <h5 id="modalTitle" class="fw-bold text-warning m-0"></h5>
            </div>

            <!-- Modal Body -->
            <div id="modalBody" class="modal-body text-center py-4"></div>

            <!-- Modal Footer -->
            <div class="modal-footer border-secondary d-flex justify-content-between">

                <button class="btn btn-outline-light px-4" data-bs-dismiss="modal">
                    Close
                </button>

                <button class="btn btn-warning fw-bold px-4 shadow-sm" id="modalAddBtn">
                    Add to Cart 🛒
                </button>

            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
